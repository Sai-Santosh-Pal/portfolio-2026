<style>
    .buttons{
        transition: all 0.8s cubic-bezier(.22, 1, .36, 1);
    }

    .btn-2:hover, .btn-1:hover{
        padding-inline: 12px;
    }

    .btn-2 {
        transition: all 0.8s cubic-bezier(.22, 1, .36, 1);
        /* font-size: 16px; */
    }
    .btn-1 {
        transition: all 0.8s cubic-bezier(.22, 1, .36, 1);
        /* font-size: 16px; */
    }
    /* .btn-1:hover + .btn-2 {
        font-size: 12px;
        padding-inline: 20px;
    } */


    * {
        font-family: 'Geist Pixel';
        /* overflow: hidden; */
    }



    @media only screen and (max-width: 768px) {
        .mobile-flip {
            transform: scaleX(-1) !important
        }
        .mobile-animate {
            transform: scaleX(1) !important
        }
    }
    
    #data {
        transition: all 0.8s cubic-bezier(.22, 1, .36, 1);
    }

    body {
        background-color: #000;
        opacity: 0.8;
        background-image:  radial-gradient(#191819 1.5px, transparent 1.5px), radial-gradient(#191819 1.5px, #000 1.5px);
        background-size: 20px 20px;
        background-position: 0 0,10px 10px;
        overflow-x: hidden;
    }

    #fx1, #fx2, #fx4, #fx5 {
        aspect-ratio: 4/3;
    }

    #fx3, #fx6 {
        aspect-ratio: 3/4;
    }

    .fx {
        position: relative;
        width: 100%;
        max-width: 325px;
        aspect-ratio: auto;
        margin: 0;
        overflow: hidden;
        isolation: isolate;
        background-color: #000;
        margin-top: -10px;
        box-shadow: 0px -10px 20px rgba(0, 0, 0, 0.4);
    }

    .bottom-hidden {
        /* background: red; */
        overflow: visible;
        clip-path: polygon(-1000% -1000%, 1000% -1000%, 1000% 100%, -1000% 100%);

    }

    .fx img {
        width: 100%;
        height: 100%;
        object-fit: cover;

        display: block;
        filter: grayscale(1) contrast(1.7) brightness(0.97);
        transform: scale(1.05);
        transition: filter .8s cubic-bezier(.22, 1, .36, 1),
              transform .8s cubic-bezier(.22, 1, .36, 1);
    }

    .fx::before{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(circle at center, #333333 0 1px, transparent 1.6px) 0 0 / 4px 4px;
        mix-blend-mode: multiply;
        opacity: 0.5;
        pointer-events: none;
        transition: opacity .8s cubic-bezier(.22, 1, .36, 1);
    }

    .fx::after {
        content: "";
        position: absolute;
        inset: -50%;
        z-index: 2;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
        opacity: 0.4;
        pointer-events: none;
        animation: grain 1s steps(6) infinite;
        transition: opacity .8s cubic-bezier(.22, 1, .36, 1);
    }

    @keyframes grain {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-3%, 2%); }
    40%  { transform: translate(2%, -3%); }
    60%  { transform: translate(-2%, -1%); }
    80%  { transform: translate(3%, 3%); }
    100% { transform: translate(0, 0); }
    }

    .fx:hover img {
        filter: grayscale(0) contrast(1) brightness(1) saturate(2);
        transform: scale(1) 
    }
    .left > div{
        position: relative;
        left: -10px;
    }
    .img{
        transition: all 0.2s .8s ease-in;
    }

    .fx:hover::before{
        opacity: 0;
    }

    .fx:hover::after {
        opacity: 0;
    }

    #fx1 {
        rotate: -10deg;
        transition: all 0.2s ease-in-out;
    }
    #fx1:hover {
        transform: rotate(-10deg)
    }

    #fx2 {
        rotate: -5deg;
        transition: all 0.2s ease-in-out;
    }
    #fx2:hover {
        transform: rotate(-10deg)
    }
    #fx3 {
        rotate: +5deg;
        transition: all 0.2s ease-in-out;
    }
    #fx3:hover {
        transform: rotate(-10deg)
    }

    #fx4 {
        rotate: +10deg;
        transition: all 0.2s ease-in-out;
    }
    #fx4:hover {
        transform: rotate(+10deg)
    }

    #fx5 {
        rotate: +5deg;
        transition: all 0.2s ease-in-out;
    }
    #fx5:hover {
        transform: rotate(+10deg)
    }
    #fx6 {
        rotate: -5deg;
        transition: all 0.2s ease-in-out;
    }
    #fx6:hover {
        transform: rotate(+10deg)
    }
    

</style>
